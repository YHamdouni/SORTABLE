<body>


    <main class="table">
        <section class="table_header">Superheros Data</section>
        <div  class="select">
            <input type="text" id="search" placeholder="Search by name">
            <select id="pageSize">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="all">All</option>
            </select>
        </div>
        <section class="table_body">
            <div id="pagination"></div>
            <table id="heroTable">
                <thead>
                    <tr>
                        <th rowspan=2>Icon</th>
                        <th id="Name" rowspan=2>Name</th>
                        <th id="FullName" rowspan=2>Full Name</th>
                        <th id="Race" rowspan=2>Race</th>
                        <th id="Gender" rowspan=2>Gender</th>
                        <th id="Height" rowspan=2>Height</th>
                        <th id="Weight" rowspan=2>Weight</th>
                        <th id="PlaceofBirth" rowspan=2>Place of Birth</th>
                        <th id="Alignment" rowspan=2>Alignment</th>
                        <th id="po" colspan="6" style="text-align: center;">Powerstats</th>
                    </tr>
                    <tr align=center>
                        <th id="Intelligence">Intelligence</th>
                        <th id="Strength"> Strength</th>
                        <th id="Speed"> Speed</th>
                        <th id="Durability"> Durability</th>
                        <th id="Power"> Power</th>
                        <th id="Combat"> Combat</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
        <div c id="btn" class="btn"></div>


    </main>
    <script src="app.js"></script>
</body>
